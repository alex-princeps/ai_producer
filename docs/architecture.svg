<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" width="1280" height="900" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1c2433" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8b98ad"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#e3a73b"/>
    </marker>
    <style>
      .title { fill:#f0f4fa; font-size:30px; font-weight:800; letter-spacing:-0.5px }
      .sub { fill:#9aa7bd; font-size:15px }
      .h { font-size:15px; font-weight:800; letter-spacing:1.4px }
      .t { fill:#e6ebf2; font-size:15px; font-weight:600 }
      .s { fill:#9aa7bd; font-size:12.5px }
      .m { fill:#c9d4e3; font-size:12px; font-family:SFMono-Regular, Menlo, Consolas, monospace }
      .num { fill:#0b0f17; font-size:13px; font-weight:800 }
      .card { fill:#141b27; stroke-width:1.5 }
      .flow { stroke:#8b98ad; stroke-width:1.8; fill:none }
      .life { stroke:#e3a73b; stroke-width:1.8; fill:none; stroke-dasharray:6 5 }
    </style>
  </defs>

  <rect width="1280" height="900" fill="url(#bg)"/>
  <rect width="1280" height="900" fill="url(#grid)" opacity="0.55"/>

  <!-- Header -->
  <text x="40" y="58" class="title">Аристарх Градов · архитектура ИИ-личности</text>
  <text x="40" y="84" class="sub">Персонаж-агент в Telegram: двухпроходное мышление · эмоции · 3 слоя памяти · автономная жизнь · живой колумнист</text>

  <!-- ============ COLUMN 1: INTERFACE ============ -->
  <text x="40" y="128" class="h" fill="#58a6ff">ИНТЕРФЕЙС</text>
  <rect x="40" y="140" width="230" height="118" rx="14" class="card" stroke="#58a6ff"/>
  <text x="58" y="168" class="t">👤 Собеседник в Telegram</text>
  <text x="58" y="192" class="s">текст · фото · PDF / DOCX /</text>
  <text x="58" y="210" class="s">XLSX / PPTX · лонгриды</text>
  <text x="58" y="236" class="m">aiogram 3 · Redis FSM</text>

  <rect x="40" y="276" width="230" height="140" rx="14" class="card" stroke="#58a6ff"/>
  <text x="58" y="304" class="t">Приём сообщений</text>
  <text x="58" y="328" class="s">debounce 2,5 с: пачка</text>
  <text x="58" y="346" class="s">сообщений → одна мысль</text>
  <text x="58" y="370" class="s">«режим романа» для простыней</text>
  <text x="58" y="394" class="s">антиспам, пока думает</text>

  <rect x="40" y="434" width="230" height="112" rx="14" class="card" stroke="#58a6ff"/>
  <text x="58" y="462" class="t">Монетизация</text>
  <text x="58" y="486" class="s">пакеты за Telegram Stars,</text>
  <text x="58" y="504" class="s">подписки, промокоды,</text>
  <text x="58" y="522" class="s">аналитика событий в SQLite</text>

  <rect x="40" y="564" width="230" height="100" rx="14" class="card" stroke="#58a6ff"/>
  <text x="58" y="592" class="t">📣 Авторская колонка</text>
  <text x="58" y="616" class="s">1 пост в день, ссылка +</text>
  <text x="58" y="634" class="s">свёрнутая цитата, 11 форматов</text>

  <!-- arrows from interface to pipeline -->
  <path d="M270 199 H318" class="flow" marker-end="url(#arrow)"/>
  <path d="M270 346 H300 V230 H318" class="flow" marker-end="url(#arrow)"/>

  <!-- ============ COLUMN 2: COGNITIVE PIPELINE ============ -->
  <text x="320" y="128" class="h" fill="#bc8cff">КОГНИТИВНЫЙ ЦИКЛ · каждое сообщение</text>
  <rect x="320" y="140" width="470" height="524" rx="16" fill="#120f1f" stroke="#bc8cff" stroke-width="1.5"/>

  <!-- step 1 -->
  <circle cx="352" cy="176" r="13" fill="#bc8cff"/><text x="347.5" y="180.5" class="num">1</text>
  <text x="376" y="172" class="t">Аффективное состояние</text>
  <text x="376" y="192" class="s">trust 0–100 · fatigue 0–100 · mood — по каждому, в базе</text>
  <!-- step 2 -->
  <circle cx="352" cy="232" r="13" fill="#bc8cff"/><text x="347.5" y="236.5" class="num">2</text>
  <text x="376" y="228" class="t">Микро-роутер → поиск в сети</text>
  <text x="376" y="248" class="s">быстрая модель решает, нужен ли интернет; ищем только тогда</text>
  <!-- step 3 -->
  <circle cx="352" cy="288" r="13" fill="#bc8cff"/><text x="347.5" y="292.5" class="num">3</text>
  <text x="376" y="284" class="t">Параллельное воспоминание</text>
  <text x="376" y="304" class="s">база знаний · эпизоды · семантические факты (asyncio.gather)</text>
  <!-- step 4 -->
  <circle cx="352" cy="344" r="13" fill="#bc8cff"/><text x="347.5" y="348.5" class="num">4</text>
  <text x="376" y="340" class="t">Ощущение себя в ситуации</text>
  <text x="376" y="360" class="s">внутренние часы (пауза с прошлого ответа) · где он сейчас</text>
  <text x="376" y="377" class="s">(московский распорядок дня) · тезис дня · убеждения</text>
  <!-- step 5 -->
  <circle cx="352" cy="414" r="13" fill="#bc8cff"/><text x="347.5" y="418.5" class="num">5</text>
  <text x="376" y="410" class="t">Внутренний монолог · скрытый</text>
  <rect x="376" y="421" width="390" height="26" rx="6" fill="#1d1733"/>
  <text x="388" y="439" class="m">&lt;THOUGHTS&gt; эмоции &lt;/THOUGHTS&gt;  &lt;STRATEGY&gt; план ответа</text>
  <!-- step 6 -->
  <circle cx="352" cy="484" r="13" fill="#bc8cff"/><text x="347.5" y="488.5" class="num">6</text>
  <text x="376" y="480" class="t">Ответ в образе</text>
  <text x="376" y="500" class="s">исполняет план, не цитируя его · защита персоны и авторства</text>
  <text x="376" y="517" class="s">историй · детектор лжи и скачков темы · фильтр ответа</text>
  <!-- step 7 -->
  <circle cx="352" cy="554" r="13" fill="#bc8cff"/><text x="347.5" y="558.5" class="num">7</text>
  <text x="376" y="550" class="t">Фильтр игнора</text>
  <text x="376" y="570" class="s">если в плане решено «игнор», собеседник получает… тишину</text>
  <!-- step 8 -->
  <circle cx="352" cy="610" r="13" fill="#8b98ad"/><text x="347.5" y="614.5" class="num">8</text>
  <text x="376" y="606" class="t">После ответа (в фоне)</text>
  <text x="376" y="626" class="s">раз в 5 реплик: факты, саммари, Δtrust и mood в память ·</text>
  <text x="376" y="643" class="s">теневой ассистент подсказывает следующий сильный вопрос</text>

  <!-- pipeline to memory arrows -->
  <path d="M790 296 H836" class="flow" marker-end="url(#arrow)"/>
  <path d="M836 620 H790" class="flow" marker-end="url(#arrow)"/>

  <!-- ============ COLUMN 3: MEMORY & STATE ============ -->
  <text x="838" y="128" class="h" fill="#3fb950">ПАМЯТЬ И СОСТОЯНИЕ</text>
  <rect x="838" y="140" width="402" height="102" rx="14" class="card" stroke="#3fb950"/>
  <text x="856" y="167" class="t">📚 Профессиональные знания</text>
  <text x="856" y="189" class="s">ChromaDB · 2,8 тыс. фрагментов лекций и эссе продюсера</text>
  <text x="856" y="207" class="s">рекурсивная нарезка, штамп источника, правило авторства:</text>
  <text x="856" y="225" class="s">чужая история от первого лица никогда не выдаётся за свою</text>

  <rect x="838" y="256" width="402" height="120" rx="14" class="card" stroke="#3fb950"/>
  <text x="856" y="283" class="t">🧠 Эпизодическая память · по каждому</text>
  <text x="856" y="305" class="s">саммари прошлых бесед, ранжирование по когнитивному весу:</text>
  <rect x="856" y="316" width="366" height="44" rx="6" fill="#0f1f16"/>
  <text x="868" y="334" class="m">score = 1.5·релевантность + 1.0·важность</text>
  <text x="868" y="352" class="m">      + 0.5·свежесть (0.99^часы, пол 0.1)</text>

  <rect x="838" y="390" width="402" height="84" rx="14" class="card" stroke="#3fb950"/>
  <text x="856" y="417" class="t">🕸 Семантические факты</text>
  <text x="856" y="439" class="s">тройки «субъект → предикат → объект» о собеседнике:</text>
  <text x="856" y="457" class="s">жёсткие факты для проверки противоречий и выдумок</text>

  <rect x="838" y="488" width="402" height="84" rx="14" class="card" stroke="#3fb950"/>
  <text x="856" y="515" class="t">🧬 Ключевые убеждения · максимум 5</text>
  <text x="856" y="537" class="s">мировоззрение от первого лица: меняется от опыта</text>
  <text x="856" y="555" class="s">и перекрывает старые лекции при противоречии</text>

  <rect x="838" y="586" width="402" height="78" rx="14" class="card" stroke="#3fb950"/>
  <text x="856" y="613" class="t">🗄 SQLite</text>
  <text x="856" y="635" class="s">пользователи · эмоции · кредиты · учёт Stars · брифы ·</text>
  <text x="856" y="653" class="s">полная аналитика событий (каждая мысль пишется в лог)</text>

  <!-- ============ AUTONOMOUS LIFE (bottom band) ============ -->
  <text x="40" y="712" class="h" fill="#e3a73b">АВТОНОМНАЯ ЖИЗНЬ · по cron, пока никто не пишет</text>
  <rect x="40" y="724" width="1200" height="92" rx="16" fill="#1a1508" stroke="#e3a73b" stroke-width="1.5"/>

  <text x="62" y="754" class="t">🌅 Утренняя повестка</text>
  <text x="62" y="776" class="s">читает новости, формирует</text>
  <text x="62" y="794" class="s">«тезис дня» (сила 0–10)</text>
  <path d="M292 770 H322" class="life" marker-end="url(#arrowO)"/>

  <text x="332" y="754" class="t">📰 Редакция и куратор</text>
  <text x="332" y="776" class="s">Telegram-каналы → шорт-лист → Ари сам</text>
  <text x="332" y="794" class="s">оценивает 0–10 и выбирает зацепку</text>
  <path d="M632 770 H662" class="life" marker-end="url(#arrowO)"/>

  <path d="M720 724 V690 H155 V668" class="life" marker-end="url(#arrowO)"/>
  <text x="672" y="754" class="t">✍️ Живой колумнист</text>
  <text x="672" y="776" class="s">11 форматов · манера и оптика ·</text>
  <text x="672" y="794" class="s">квоты мотивов · отвечает сам себе</text>
  <path d="M912 770 H942" class="life" marker-end="url(#arrowO)"/>

  <text x="952" y="754" class="t">🌙 Ночь: сон и рефлексия</text>
  <text x="952" y="776" class="s">консолидация памяти, сброс усталости</text>
  <text x="952" y="794" class="s">воскресенье: эволюция убеждений</text>

  <!-- ============ FOOTER: MODELS + QA ============ -->
  <rect x="40" y="836" width="780" height="46" rx="12" class="card" stroke="#f778ba"/>
  <text x="58" y="865" class="t" fill="#f778ba">МОДЕЛИ</text>
  <text x="150" y="865" class="s">Gemini 3.1 Pro — монолог и голос · 2.5 Flash — роутер, память, рефлексия · Flash-Lite — редакция · эмбеддинги</text>

  <rect x="838" y="836" width="402" height="46" rx="12" class="card" stroke="#39c5cf"/>
  <text x="856" y="865" class="t" fill="#39c5cf">QA</text>
  <text x="890" y="865" class="s">сквозные тесты через Telethon + судья LLM-as-a-Judge</text>
</svg>
