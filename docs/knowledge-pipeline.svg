<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1c2433" stroke-width="1"/>
    </pattern>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8b98ad"/>
    </marker>
    <style>
      .title { fill:#f0f4fa; font-size:28px; font-weight:800; letter-spacing:-0.5px }
      .sub { fill:#9aa7bd; font-size:15px }
      .h { font-size:15px; font-weight:800; letter-spacing:1.4px }
      .t { fill:#e6ebf2; font-size:16px; font-weight:700 }
      .s { fill:#9aa7bd; font-size:12.5px }
      .joke { fill:#e3a73b; font-size:12.5px; font-style:italic }
      .m { fill:#c9d4e3; font-size:12px; font-family:SFMono-Regular, Menlo, Consolas, monospace }
      .card { fill:#141b27; stroke-width:1.5 }
      .flow { stroke:#8b98ad; stroke-width:1.8; fill:none }
    </style>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.55"/>

  <text x="40" y="56" class="title">Подключите свою базу знаний</text>
  <text x="40" y="82" class="sub">Положите файлы в папку. Аристарх превратит их в профессиональное чутьё и не перепутает свои истории с чужими.</text>

  <!-- INGEST -->
  <text x="40" y="126" class="h" fill="#3fb950">ИНДЕКСАЦИЯ · один раз при первом запуске</text>

  <rect x="40" y="140" width="220" height="150" rx="14" class="card" stroke="#3fb950"/>
  <text x="58" y="170" class="t">📂 Ваши материалы</text>
  <text x="58" y="194" class="m">.pdf .docx .txt .md</text>
  <text x="58" y="216" class="s">лекции, методички, эссе,</text>
  <text x="58" y="234" class="s">кейсы, рабочие заметки</text>
  <text x="58" y="272" class="joke">мусор на входе = мусор в 4K</text>

  <path d="M260 215 H288" class="flow" marker-end="url(#a)"/>
  <rect x="290" y="140" width="220" height="150" rx="14" class="card" stroke="#3fb950"/>
  <text x="308" y="170" class="t">✂️ Умная нарезка</text>
  <text x="308" y="194" class="s">абзац → предложение → слово</text>
  <text x="308" y="214" class="m">1200 симв. · нахлёст 200</text>
  <text x="308" y="236" class="s">мысли остаются целыми</text>
  <text x="308" y="272" class="joke">режет как монтажёр, не мясник</text>

  <path d="M510 215 H538" class="flow" marker-end="url(#a)"/>
  <rect x="540" y="140" width="220" height="150" rx="14" class="card" stroke="#3fb950"/>
  <text x="558" y="170" class="t">🏷 Штамп источника</text>
  <text x="558" y="194" class="m">[SOURCE: имя файла]</text>
  <text x="558" y="216" class="s">клеится к каждому куску,</text>
  <text x="558" y="234" class="s">чтобы знать, чьи это слова</text>
  <text x="558" y="272" class="joke">происхождение, а не вайб</text>

  <path d="M760 215 H788" class="flow" marker-end="url(#a)"/>
  <rect x="790" y="140" width="220" height="150" rx="14" class="card" stroke="#3fb950"/>
  <text x="808" y="170" class="t">🧬 Эмбеддинги</text>
  <text x="808" y="194" class="m">gemini-embedding-001</text>
  <text x="808" y="216" class="s">батчами, бережно к лимитам</text>
  <text x="808" y="272" class="joke">проза → пара тысяч флоатов</text>

  <path d="M1010 215 H1038" class="flow" marker-end="url(#a)"/>
  <rect x="1040" y="140" width="200" height="150" rx="14" class="card" stroke="#3fb950"/>
  <text x="1058" y="170" class="t">🗄 ChromaDB</text>
  <text x="1058" y="194" class="m">aristarkh_knowledge</text>
  <text x="1058" y="216" class="s">на диске, строится раз,</text>
  <text x="1058" y="234" class="s">самолечение при сбое</text>
  <text x="1058" y="272" class="joke">векторная БД, а не дневник</text>

  <!-- down arrow to retrieval -->
  <path d="M1140 290 V352" class="flow" marker-end="url(#a)"/>

  <!-- RETRIEVE -->
  <text x="40" y="340" class="h" fill="#bc8cff">ВОСПОМИНАНИЕ · на каждое сообщение и каждый пост</text>

  <rect x="40" y="354" width="300" height="150" rx="14" class="card" stroke="#bc8cff"/>
  <text x="58" y="384" class="t">📨 Сообщение или новость</text>
  <text x="58" y="408" class="s">запрос + подсказка домена, top-k</text>
  <text x="58" y="428" class="m">k = 5 в чате · k = 3 в постах</text>
  <text x="58" y="486" class="joke">по делу, а не просто похожее</text>

  <path d="M190 504 V518 H1140 V508" class="flow" marker-end="url(#a)"/>
  <path d="M1040 430 H1000" class="flow" marker-end="url(#a)"/>
  <rect x="690" y="354" width="310" height="150" rx="14" class="card" stroke="#bc8cff"/>
  <text x="708" y="384" class="t">🛡 Правила авторства</text>
  <text x="708" y="408" class="s">методология → «мой опыт, мои слова»</text>
  <text x="708" y="428" class="s">чужая история от первого лица →</text>
  <text x="708" y="446" class="s">«коллега как-то рассказывал…»</text>
  <text x="708" y="486" class="joke">никаких «согласно моей базе знаний»</text>

  <path d="M690 430 H650" class="flow" marker-end="url(#a)"/>
  <rect x="370" y="354" width="280" height="150" rx="14" class="card" stroke="#bc8cff"/>
  <text x="388" y="384" class="t">🎭 Голос персонажа</text>
  <text x="388" y="408" class="s">знания становятся чутьём:</text>
  <text x="388" y="428" class="s">55-летний шоураннер, который</text>
  <text x="388" y="446" class="s">«просто знает, как это устроено»</text>
  <text x="388" y="486" class="joke">звучит как профи, а не реферат</text>

  <rect x="1040" y="354" width="200" height="150" rx="14" class="card" stroke="#bc8cff"/>
  <text x="1058" y="384" class="t">🔎 Близость</text>
  <text x="1058" y="408" class="s">ближайшие соседи (L2)</text>
  <text x="1058" y="428" class="s">+ штампы источников</text>
  <text x="1058" y="486" class="joke">ни один LangChain не пострадал</text>

  <!-- footer -->
  <rect x="40" y="532" width="1200" height="72" rx="14" class="card" stroke="#e3a73b"/>
  <text x="58" y="562" class="t" fill="#e3a73b">Демо-корпус в комплекте</text>
  <text x="58" y="586" class="s">knowledge_base/demo/ · четыре заметки по методологии + одна чужая байка от первого лица, которую персонаж не вправе выдавать за свою. Замените на свои файлы и перезапустите.</text>
</svg>
